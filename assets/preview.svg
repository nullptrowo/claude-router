<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Outer Window -->
  <rect x="14" y="14" width="952" height="582" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Title Bar -->
  <rect x="14" y="14" width="952" height="38" rx="12" fill="#161b22"/>
  <rect x="14" y="38" width="952" height="14" fill="#161b22"/>
  <line x1="14" y1="52" x2="966" y2="52" stroke="#30363d" stroke-width="1"/>
  <circle cx="38" cy="33" r="6" fill="#ff5f56"/>
  <circle cx="58" cy="33" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="33" r="6" fill="#27c93f"/>
  <text x="490" y="38" text-anchor="middle" fill="#8b949e" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" font-weight="600">claude — v2.1.305 (Smart Router :20129 -&gt; OmniRoute :20128)</text>

  <!-- Content -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.2">
    <!-- Section 1: /model Picker -->
    <text x="40" y="80" fill="#79c0ff" font-weight="700">Select model</text>
    <text x="40" y="99" fill="#8b949e">Switch between Claude models. Your pick becomes the default for new sessions.</text>

    <text x="52" y="126" fill="#c9d1d9">1. Default (recommended)</text>
    <text x="315" y="126"><tspan fill="#d97757" font-weight="700">Opus 5.5</tspan><tspan fill="#8b949e"> · Best for everyday, complex tasks · 1M context</tspan></text>

    <text x="52" y="147" fill="#c9d1d9">2. Opus</text>
    <text x="315" y="147"><tspan fill="#d97757" font-weight="700">Opus 5.5</tspan><tspan fill="#8b949e"> · Best for everyday, complex tasks · 1M context</tspan></text>

    <text x="52" y="168" fill="#c9d1d9">3. Fable</text>
    <text x="315" y="168"><tspan fill="#c9d1d9">Fable 5.1</tspan><tspan fill="#8b949e"> · Most capable for hardest and longest-running tasks</tspan></text>

    <text x="52" y="189" fill="#c9d1d9">4. Sonnet</text>
    <text x="315" y="189"><tspan fill="#c9d1d9">Sonnet 5.5</tspan><tspan fill="#8b949e"> · Efficient for routine tasks · 1M context</tspan></text>

    <text x="52" y="210" fill="#c9d1d9">5. Haiku</text>
    <text x="315" y="210"><tspan fill="#c9d1d9">Haiku 5.5</tspan><tspan fill="#8b949e"> · Fastest for quick answers</tspan></text>

    <text x="52" y="231" fill="#c9d1d9">6. Gemini 4 Argon</text>
    <text x="315" y="231"><tspan fill="#79c0ff">Google Antigravity 5x</tspan><tspan fill="#8b949e"> · 1M context</tspan></text>

    <!-- Selected Row -->
    <rect x="34" y="238" width="912" height="21" rx="4" fill="#1f2937" opacity="0.8"/>
    <text x="38" y="253" fill="#79c0ff" font-weight="700">&gt;</text>
    <text x="52" y="253" fill="#3fb950" font-weight="700">7. DeepSeek V4.1 Flash 1017 ✓</text>
    <text x="315" y="253" fill="#e6edf3">Smart Pool (Cline + CodeBuddy + KiloCode) · 1M context</text>

    <text x="52" y="274" fill="#c9d1d9">8. Kimi K3</text>
    <text x="315" y="274" fill="#8b949e">Smart Pool (Cline + CodeBuddy + KiloCode) · 1M context</text>

    <!-- Effort Slider -->
    <circle cx="44" cy="298" r="3.5" fill="#d97757"/>
    <text x="56" y="302"><tspan fill="#e6edf3" font-weight="700">Max effort</tspan><tspan fill="#8b949e">  &lt;-/-&gt; to adjust (Low · Medium · High · xHigh · Max)</tspan></text>

    <line x1="34" y1="318" x2="946" y2="318" stroke="#21262d" stroke-width="1"/>

    <!-- Section 2: Native Thinking (∴) Across Custom Models -->
    <text x="40" y="342" fill="#79c0ff" font-weight="700">Native Thinking (∴) Streaming — Gemini 4 Argon · DeepSeek V4.1 · Kimi K3</text>

    <!-- Gemini 4 Argon Thought Block -->
    <rect x="40" y="353" width="900" height="54" rx="6" fill="#131820" stroke="#21262d" stroke-width="1"/>
    <text x="52" y="372"><tspan fill="#79c0ff" font-weight="700">Gemini 4 Argon</tspan><tspan fill="#6e7681">  [agy/gemini-4-argon-high · includeThoughts=true · thinking_delta]</tspan></text>
    <text x="52" y="394" fill="#8b949e" font-style="italic">∴ Let me inspect the movement simulation tick loop and verify GrimAC reach constraints before patching...</text>

    <!-- DeepSeek V4.1 Flash 1017 Thought Block -->
    <rect x="40" y="415" width="900" height="54" rx="6" fill="#131820" stroke="#21262d" stroke-width="1"/>
    <text x="52" y="434"><tspan fill="#3fb950" font-weight="700">DeepSeek V4.1 Flash 1017</tspan><tspan fill="#6e7681">  [cl/deepseek/deepseek-v4.1-flash-1017 · effort=max · thinking_delta]</tspan></text>
    <text x="52" y="456" fill="#8b949e" font-style="italic">∴ Analyzing OAuth pool latency: Cline responded in 210ms; streaming reasoning tokens prior to tool call...</text>

    <!-- Kimi K3 Thought Block -->
    <rect x="40" y="477" width="900" height="54" rx="6" fill="#131820" stroke="#21262d" stroke-width="1"/>
    <text x="52" y="496"><tspan fill="#d2a8ff" font-weight="700">Kimi K3</tspan><tspan fill="#6e7681">  [cl/moonshotai/kimi-k3 -&gt; cbai/kimi-k3 · effort=max · thinking_delta]</tspan></text>
    <text x="52" y="518" fill="#8b949e" font-style="italic">∴ Checking cross-file references and validating edge cases before executing the atomic edit...</text>
  </g>

  <!-- Footer Statusline (Vector-aligned bars & crisp segments) -->
  <rect x="15" y="554" width="950" height="41" rx="10" fill="#161b22"/>
  <line x1="14" y1="554" x2="966" y2="554" stroke="#30363d" stroke-width="1"/>

  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12.2">
    <!-- Segment 1: Active Model -->
    <text x="32" y="579"><tspan fill="#3fb950" font-weight="700">DeepSeek V4.1</tspan><tspan fill="#d97757" font-weight="600"> Max</tspan></text>
    <line x1="162" y1="567" x2="162" y2="583" stroke="#484f58" stroke-width="1.2"/>

    <!-- Segment 2: 7d Gauge (Continuous TrueColor Track) -->
    <text x="172" y="579" fill="#8b949e">7d</text>
    <rect x="193" y="573.5" width="46" height="3.2" rx="1.5" fill="#30363d"/>
    <rect x="193" y="573.5" width="11" height="3.2" rx="1.5" fill="#3fb950"/>
    <text x="247" y="579"><tspan fill="#3fb950" font-weight="600">15%</tspan><tspan fill="#8b949e"> 5d2h </tspan><tspan fill="#484f58">· </tspan><tspan fill="#79c0ff" font-weight="600">AGY </tspan><tspan fill="#d29922" font-weight="600">71%</tspan></text>
    <line x1="406" y1="567" x2="406" y2="583" stroke="#484f58" stroke-width="1.2"/>

    <!-- Segment 3: 5h Gauge (Continuous TrueColor Track) -->
    <text x="416" y="579" fill="#8b949e">5h</text>
    <rect x="437" y="573.5" width="32" height="3.2" rx="1.5" fill="#30363d"/>
    <rect x="437" y="573.5" width="5" height="3.2" rx="1.5" fill="#3fb950"/>
    <text x="477" y="579"><tspan fill="#3fb950" font-weight="600">1%</tspan><tspan fill="#8b949e"> 3h20m </tspan><tspan fill="#484f58">· </tspan><tspan fill="#79c0ff" font-weight="600">AGY </tspan><tspan fill="#3fb950" font-weight="600">3%</tspan></text>
    <line x1="628" y1="567" x2="628" y2="583" stroke="#484f58" stroke-width="1.2"/>

    <!-- Segment 4: Prompt Cache Hit & TTL -->
    <text x="638" y="579"><tspan fill="#8b949e">cache </tspan><tspan fill="#3fb950" font-weight="600">98.3%</tspan><tspan fill="#8b949e"> ttl </tspan><tspan fill="#3fb950" font-weight="600">60m</tspan></text>
    <line x1="786" y1="567" x2="786" y2="583" stroke="#484f58" stroke-width="1.2"/>

    <!-- Segment 5: Context & Turns -->
    <text x="796" y="579"><tspan fill="#8b949e">ctx </tspan><tspan fill="#d2a8ff" font-weight="600">127.3k (13%)</tspan><tspan fill="#8b949e"> 12t</tspan></text>
  </g>
</svg>
